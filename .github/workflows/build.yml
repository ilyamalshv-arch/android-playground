name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk playground-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: playground-apk
          path: playground-${{ github.run_number }}.apk

      # A release gives a direct .apk download link that opens nicely on the phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: playground-${{ github.run_number }}.apk
          make_latest: true
